<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Traffic Dodge — cross 12 lanes of speeding traffic, dodge cars, trucks and police. Free single-file HTML5 arcade game.">
<title>Traffic Dodge · Cross the Highway</title>
<script>
// 平台 SDK 按域名条件加载（独立运行时完全不加载，游戏行为不变）
(function () {
  var host = location.hostname || "";
  try {
    if (host.indexOf("crazygames") !== -1) {
      var s1 = document.createElement("script");
      s1.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      s1.onload = function () {
        if (window.CrazyGames && window.CrazyGames.SDK) {
          window.CrazyGames.SDK.init().then(function () {
            try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
            window.addEventListener("load", function () { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} });
          }).catch(function () {});
        }
      };
      document.head.appendChild(s1);
      window.__portal = "crazygames";
    } else if (host.indexOf("gamedistribution") !== -1 || host.indexOf("html5.gamedistribution.com") !== -1 || host.indexOf("gd.games") !== -1) {
      var s2 = document.createElement("script");
      s2.src = "https://sdk.gamedistribution.com/v2/main.min.js";
      document.head.appendChild(s2);
      window.__portal = "gamedistribution";
    }
  } catch (e) {}
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#10141c; font-family:-apple-system,"Segoe UI",Arial,sans-serif; overscroll-behavior:none; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #hud { width:100%; max-width:480px; display:flex; justify-content:space-between; align-items:center; padding:8px 14px 6px; color:#e8eef2; }
  .stat { text-align:center; }
  .stat .label { font-size:10px; color:#7d8aa0; letter-spacing:1px; }
  .stat .val { font-size:19px; font-weight:800; }
  #sndBtn { background:#1d2733; color:#9fb4c8; border:1px solid #2c3a4a; border-radius:8px; padding:6px 8px; font-size:10px; font-weight:700; cursor:pointer; letter-spacing:1px; }
  #sndBtn:active { transform:scale(.96); }
  canvas { display:block; border-radius:12px; touch-action:none; background:#173a24; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(8,12,18,.74); z-index:5; border-radius:12px; }
  #panel { background:#16202c; border:1px solid #2c3a4a; border-radius:18px; padding:26px 32px; text-align:center; color:#fff; max-width:88%; }
  #panel h2 { font-size:22px; margin-bottom:8px; letter-spacing:1px; color:#7dff9e; }
  #panel p { color:#9aabc0; font-size:13px; margin-bottom:14px; line-height:1.55; }
  #panel .final { font-size:32px; font-weight:900; color:#ffd76a; margin-bottom:16px; }
  #playBtn { background:linear-gradient(135deg,#3fae5a,#2a7fb8); color:#fff; border:none; border-radius:12px; padding:12px 38px; font-size:16px; font-weight:800; cursor:pointer; letter-spacing:1px; }
  #playBtn:active { transform:scale(.97); }
  #footer { color:#55606e; font-size:11px; padding:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat"><div class="label">SCORE</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">ROUND</div><div class="val" id="round">1</div></div>
    <div class="stat"><div class="label">LIVES</div><div class="val" id="lives">&#9829;&#9829;&#9829;</div></div>
    <div class="stat"><div class="label">BEST</div><div class="val" id="best">0</div></div>
    <button id="sndBtn">SOUND ON</button>
  </div>
  <div style="position:relative">
    <canvas id="game"></canvas>
    <div id="overlay"><div id="panel">
      <h2 id="ovTitle">TRAFFIC DODGE</h2>
      <p id="ovText"></p>
      <div class="final" id="finalScore" style="display:none">0</div>
      <button id="playBtn">PLAY</button>
    </div></div>
  </div>
  <div id="footer">Traffic Dodge — a free arcade crossing game</div>
</div>
<script>
"use strict";
// ===================== 纯逻辑区（无 DOM，可被 node 测试脚本抽取验证） =====================
// >>> SIM-EXTRACT 纯逻辑区开始
var ROAD_W = 432, CELL = 48, OX = 24, TRACK_C = 528, PW = 30, N_LANES = 12;
var SPEED_TIERS = [70, 110, 160];   // 三档车速 (px/s)
var GAP_PRESETS = [72, 96, 130];    // 三档车间距 (px)

function makeRng(a) { // mulberry32 可复现随机数
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 生成一轮 12 条车道。关键可过性规则：
// 1) 相邻同向车道强制同速 + 相位对齐 -> 两条车道永远存在对齐的双车间隙（不会永久死锁）
// 2) 因此同向相邻车道速度差恒为 0%，满足 < 20% 的要求
// 3) 警车更快，但车内采用跟车防重叠，剩余间隙仍 >= 69px（玩家宽 30px）
function genLanes(round, rng) {
  var mult = Math.min(1 + (round - 1) * 0.07, 2); // 每轮整体加速，封顶 2 倍
  var lanes = [], prev = null;
  for (var L = 1; L <= N_LANES; L++) {
    var dir = rng() < 0.5 ? 1 : -1;
    var speed, phase;
    if (prev && prev.dir === dir) {
      speed = prev.speed;        // 同向 -> 完全同速
      phase = prev.cars[0].s;    // 同向 -> 相位对齐（间隙起点一致）
    } else {
      speed = SPEED_TIERS[(rng() * SPEED_TIERS.length) | 0] * mult;
      phase = rng() * TRACK_C;
    }
    var roll = rng();
    var type = roll < 0.1 ? "police" : (roll < 0.27 ? "truck" : "car");
    var len = type === "truck" ? 96 : 77; // 卡车 2 格长
    var gap = GAP_PRESETS[(rng() * GAP_PRESETS.length) | 0];
    var n = Math.max(1, Math.floor(TRACK_C / (len + gap)));
    var spacing = TRACK_C / n;
    var cars = [], policeIdx = (rng() * n) | 0;
    for (var k = 0; k < n; k++) {
      var own = speed;
      if (type === "police" && k === policeIdx) own = Math.min(speed * 1.4, 430); // 警车快
      cars.push({ s: (phase + k * spacing) % TRACK_C, own: own, len: len });
    }
    var lane = { dir: dir, speed: speed, type: type, cars: cars };
    lanes.push(lane); prev = lane;
  }
  return lanes;
}

// 车道推进一帧：环道坐标 s，简单跟车模型防止同车道车辆重叠（警车会跟前车减速）
function stepLane(lane, dt) {
  var cars = lane.cars, n = cars.length;
  var v = new Array(n);
  for (var i = n - 1; i >= 0; i--) {
    var me = cars[i], ahead = cars[(i + 1) % n];
    var gap = (ahead.s - ahead.len - me.s + TRACK_C) % TRACK_C; // 我的车头到前车车尾的环道距离
    var vAhead = (i + 1 < n && v[i + 1] !== undefined) ? v[i + 1] : ahead.own;
    v[i] = gap < me.len * 0.9 ? vAhead : me.own;
  }
  for (var j = 0; j < n; j++) cars[j].s = (cars[j].s + v[j] * dt) % TRACK_C;
}

// 车道内所有车的路面矩形（路面坐标 x0..x0+len，供碰撞/渲染/模拟共用）
function carRects(lane) {
  var out = [];
  for (var i = 0; i < lane.cars.length; i++) {
    var c = lane.cars[i];
    out.push({ x0: lane.dir > 0 ? c.s - c.len : ROAD_W - c.s, len: c.len, car: c });
  }
  return out;
}

// 车道是否占用路面区间 [x0, x1]
function rectBlocked(lane, x0, x1) {
  for (var i = 0; i < lane.cars.length; i++) {
    var c = lane.cars[i];
    var cx0 = lane.dir > 0 ? c.s - c.len : ROAD_W - c.s;
    if (cx0 < x1 && cx0 + c.len > x0) return true;
  }
  return false;
}
// <<< SIM-EXTRACT 纯逻辑区结束

// ===================== 画布与自适应 =====================
var W = 480, H = 720;
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.scale(dpr, dpr);

function fit() { // canvas 同时受宽高约束，完整可见
  var hudH = document.getElementById("hud").offsetHeight;
  var footH = document.getElementById("footer").offsetHeight;
  var availW = Math.min(window.innerWidth - 8, 480);
  var availH = window.innerHeight - hudH - footH - 14;
  var sc = Math.min(availW / W, availH / H, 1);
  if (!(sc > 0.05)) sc = 0.3; // 极小窗口兜底
  canvas.style.width = Math.floor(W * sc) + "px";
  canvas.style.height = Math.floor(H * sc) + "px";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);

// ===================== 状态 =====================
var state = "MENU"; // MENU | PLAY | OVER
var score = 0, best = 0, round = 1, lives = 3, combo = 0, maxRow = 13;
var nightOn = false, nightT = 0; // 分数 > 30 进入夜间，nightT 为过渡系数
try { best = parseInt(localStorage.getItem("td_best") || "0", 10) || 0; } catch (e) {}
var muted = false;
try { muted = localStorage.getItem("td_muted") === "1"; } catch (e) {}

var CAR_COLORS = ["#e8574b", "#4b9fe8", "#f2b544", "#7bc86c", "#b58ce8", "#e87bb4", "#5fd3c4"];
function decorate(arr) { // 车漆颜色属表现层，放逻辑区外（保证模拟抽取纯净）
  for (var i = 0; i < arr.length; i++) {
    var cs = arr[i].cars;
    for (var k = 0; k < cs.length; k++) cs[k].col = CAR_COLORS[(Math.random() * CAR_COLORS.length) | 0];
  }
}

var lanes = genLanes(1, makeRng(20251025)); decorate(lanes); // 菜单背景预览
var player = { col: 4, row: 13, px: OX + 4 * CELL + CELL / 2, py: 13 * CELL + CELL / 2, moving: null, inv: 0, face: 0 };

// 草丛（固定伪随机布局）
var tufts = [];
(function () {
  var rg = makeRng(777);
  for (var i = 0; i < 46; i++) tufts.push({ x: rg() * W, y: rg() < 0.5 ? 8 + rg() * 34 : 632 + rg() * 80, w: 5 + rg() * 9 });
})();

// ===================== 音效（WebAudio 合成） =====================
var actx = null;
function ensureAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
function beep(freq, dur, type, gainv, delay, slide) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(gainv || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function sMove() { beep(520, 0.045, "square", 0.035); }                       // 移动嘀嗒
function sLane(c) { beep(620 + Math.min(c, 12) * 45, 0.1, "triangle", 0.09); } // 穿道
function sGoal() { beep(523, 0.09, "triangle", 0.1); beep(659, 0.09, "triangle", 0.1, 0.09); beep(784, 0.16, "triangle", 0.12, 0.18); } // 到顶
function sCrash() { beep(160, 0.3, "sawtooth", 0.14, 0, 55); beep(90, 0.35, "square", 0.1, 0.02, 40); } // 被撞
function sOver() { beep(300, 0.5, "sawtooth", 0.1, 0, 80); }

// ===================== 特效 =====================
var particles = [], floats = [], toasts = [];
function popFX(x, y, colors) {
  for (var i = 0; i < 14; i++) {
    var a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 160;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.55, color: colors[(Math.random() * colors.length) | 0], size: 2 + Math.random() * 3 });
  }
}
function floatText(x, y, text, color) { floats.push({ x: x, y: y, text: text, life: 0.9, color: color || "#fff" }); }
function toast(text, color) { toasts.push({ text: text, life: 1.6, color: color || "#fff" }); }

// ===================== HUD =====================
function fmtScore(v) { var r = Math.round(v * 2) / 2; return r % 1 === 0 ? String(r) : r.toFixed(1); }
function updHUD() {
  document.getElementById("score").textContent = fmtScore(score);
  document.getElementById("round").textContent = round;
  document.getElementById("lives").textContent = lives > 0 ? "\u2665\uFE0E".repeat(lives) : "\u2014";
  document.getElementById("best").textContent = fmtScore(Math.max(best, score));
}

// ===================== 平台埋点（域名守卫，仅 crazygames 域生效） =====================
function cgSDK() { try { return window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK; } catch (e) { return false; } }
function cgStart() { if (cgSDK()) { try { window.CrazyGames.SDK.game.gameplayStart(); } catch (e) {} } }
function cgStop(happy) {
  if (cgSDK()) {
    try {
      window.CrazyGames.SDK.game.gameplayStop();
      if (happy) window.CrazyGames.SDK.game.happytime();
    } catch (e) {}
  }
}

// ===================== 流程 =====================
function respawn() { // 回到底部草地，1.5 秒无敌闪烁；出生点在草地上天然安全
  player.col = 4; player.row = 13;
  player.px = OX + 4 * CELL + CELL / 2; player.py = 13 * CELL + CELL / 2;
  player.moving = null; player.inv = 1.5; player.face = 0;
  maxRow = 13;
}
function startGame() {
  score = 0; round = 1; lives = 3; combo = 0; nightOn = false; nightT = 0;
  lanes = genLanes(1, makeRng((Math.random() * 2147483647) | 0)); decorate(lanes);
  particles = []; floats = []; toasts = [];
  respawn();
  state = "PLAY";
  document.getElementById("overlay").style.display = "none";
  updHUD();
  cgStart(); // 平台埋点：对局开始
}
function roundComplete() {
  score += 5;
  var fx = player.px + OX, fy = player.py - 24;
  round++;
  lanes = genLanes(round, makeRng((Math.random() * 2147483647) | 0)); decorate(lanes);
  respawn();
  floatText(fx, fy, "+5", "#7dff9e");
  toast("SAFE! +5", "#7dff9e");
  sGoal();
  if (cgSDK()) { try { window.CrazyGames.SDK.game.happytime(); } catch (e) {} }
  updHUD();
}
function die() {
  lives--; combo = 0;
  sCrash();
  popFX(player.px + OX, player.py, ["#ff6b57", "#ffd76a", "#c8ccd4"]);
  updHUD();
  if (lives <= 0) {
    state = "OVER";
    if (score > best) { best = score; try { localStorage.setItem("td_best", String(best)); } catch (e) {} }
    showOverlay("OVER");
    sOver();
    cgStop(true); // 平台埋点：对局结束
  } else {
    respawn();
  }
}
function showOverlay(kind) {
  var t = document.getElementById("ovTitle"), p = document.getElementById("ovText");
  var f = document.getElementById("finalScore"), b = document.getElementById("playBtn");
  if (kind === "MENU") {
    t.textContent = "TRAFFIC DODGE";
    p.innerHTML = "Cross 12 lanes of speeding traffic.<br>Each new lane +1 &middot; reach the top grass +5.<br>Chain lanes without dying for combo bonus!<br><br>Arrows / WASD &middot; swipe or tap on mobile";
    f.style.display = "none";
    b.textContent = "PLAY";
  } else {
    t.textContent = "GAME OVER";
    p.textContent = "You were hit! Final score:";
    f.textContent = fmtScore(score);
    f.style.display = "block";
    b.textContent = "PLAY AGAIN";
  }
  document.getElementById("overlay").style.display = "flex";
}

// ===================== 网格移动（补间到像素坐标，两者始终一致） =====================
function tryMove(dc, dr) {
  if (state !== "PLAY" || player.moving) return;
  var tc = Math.max(0, Math.min(8, player.col + dc));
  var tr = Math.max(0, Math.min(14, player.row + dr));
  if (tc === player.col && tr === player.row) return;
  player.face = dc > 0 ? Math.PI / 2 : dc < 0 ? -Math.PI / 2 : (dr > 0 ? Math.PI : 0);
  player.moving = {
    sx: player.px, sy: player.py,
    tx: OX + tc * CELL + CELL / 2, ty: tr * CELL + CELL / 2,
    t: 0, dur: 0.09
  };
  player.col = tc; player.row = tr;
  sMove();
}
function finishMove(m) {
  player.px = m.tx; player.py = m.ty; player.moving = null;
  if (player.row < maxRow) { // 只统计历史最高行（行号越小越靠上），退回再上不计分
    maxRow = player.row;
    if (player.row === 0) { roundComplete(); return; }
    combo++;                       // 连续穿道不被撞，连击 +1
    var gain = 1 + combo * 0.5;    // +1 分 + combo*0.5 额外分
    score += gain;
    floatText(player.px + OX, player.py - 26, "+" + fmtScore(gain) + (combo > 1 ? "  x" + combo : ""), "#ffe9a8");
    sLane(combo);
    updHUD();
  }
}

// ===================== 更新 =====================
var nowSec = 0;
function update(dt) {
  var i;
  for (i = 0; i < lanes.length; i++) stepLane(lanes[i], dt); // 车流常动（菜单里作背景）
  if (score > 30 && !nightOn) { nightOn = true; toast("NIGHT DRIVE", "#9fc4ff"); }
  nightT += ((nightOn ? 1 : 0) - nightT) * Math.min(1, dt * 2.5);
  for (i = particles.length - 1; i >= 0; i--) { var pt = particles[i]; pt.life -= dt; if (pt.life <= 0) { particles.splice(i, 1); continue; } pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 320 * dt; }
  for (i = floats.length - 1; i >= 0; i--) { var fl = floats[i]; fl.life -= dt; fl.y -= 42 * dt; if (fl.life <= 0) floats.splice(i, 1); }
  for (i = toasts.length - 1; i >= 0; i--) { toasts[i].life -= dt; if (toasts[i].life <= 0) toasts.splice(i, 1); }
  if (player.inv > 0) player.inv -= dt;
  if (player.moving) {
    var m = player.moving; m.t += dt;
    var k = Math.min(1, m.t / m.dur);
    player.px = m.sx + (m.tx - m.sx) * k;
    player.py = m.sy + (m.ty - m.sy) * k;
    if (k >= 1) finishMove(m);
  }
  // 碰撞：无敌期跳过；检测玩家矩形重叠的所有车道行
  if (state === "PLAY" && player.inv <= 0) {
    var x0 = player.px - PW / 2, x1 = player.px + PW / 2;
    var y0 = player.py - 15, y1 = player.py + 15;
    var r0 = Math.max(1, Math.floor(y0 / CELL)), r1 = Math.min(N_LANES, Math.floor((y1 - 0.001) / CELL));
    for (var r = r0; r <= r1; r++) {
      var top = r * CELL;
      if (y1 > top + 9 && y0 < top + 39 && rectBlocked(lanes[r - 1], x0, x1)) { die(); break; }
    }
  }
}

// ===================== 渲染（全程序化绘制） =====================
function hexLerp(h1, h2, t) {
  var a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  var r = Math.round(((a >> 16) & 255) + (((b >> 16) & 255) - ((a >> 16) & 255)) * t);
  var g = Math.round(((a >> 8) & 255) + (((b >> 8) & 255) - ((a >> 8) & 255)) * t);
  var bl = Math.round((a & 255) + ((b & 255) - (a & 255)) * t);
  return "rgb(" + r + "," + g + "," + bl + ")";
}
function roundRect(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

function drawCar(rc, lane, top, nt) {
  var x = rc.x0 + OX, len = rc.len, car = rc.car, dir = lane.dir, y = top + 9;
  if (x + len < -8 || x > W + 8) return;
  if (nt > 0.05) { // 夜间车灯前照光锥
    var fx = dir > 0 ? x + len : x;
    ctx.globalAlpha = nt;
    ctx.fillStyle = "rgba(255,225,140,0.10)";
    ctx.beginPath();
    ctx.moveTo(fx, y + 6); ctx.lineTo(fx + dir * 52, y - 8); ctx.lineTo(fx + dir * 52, y + 38); ctx.lineTo(fx, y + 24);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#15161c"; // 轮子
  ctx.fillRect(x + 7, y - 2, 12, 4); ctx.fillRect(x + len - 19, y - 2, 12, 4);
  ctx.fillRect(x + 7, y + 28, 12, 4); ctx.fillRect(x + len - 19, y + 28, 12, 4);
  if (car.len === 96) { // 卡车：货柜 + 车头
    var cabW = 30, cabX = dir > 0 ? x + len - cabW : x;
    ctx.fillStyle = "#d8dbe2"; roundRect(ctx, dir > 0 ? x : x + cabW + 3, y, len - cabW - 3, 30, 5); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.stroke();
    ctx.fillStyle = car.col; roundRect(ctx, cabX, y, cabW, 30, 6); ctx.fill();
    ctx.fillStyle = "rgba(15,20,30,.85)";
    ctx.fillRect(dir > 0 ? cabX + cabW - 10 : cabX + 3, y + 4, 7, 22);
  } else {
    ctx.fillStyle = lane.type === "police" ? "#f2f4f8" : car.col;
    roundRect(ctx, x, y, len, 30, 8); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.14)"; // 车顶高光
    roundRect(ctx, x + len * 0.28, y + 5, len * 0.44, 20, 5); ctx.fill();
    ctx.fillStyle = "rgba(15,20,30,.85)"; // 挡风玻璃
    ctx.fillRect(dir > 0 ? x + len - 16 : x + 9, y + 4, 7, 22);
    if (lane.type === "police") { // 警灯红蓝交替
      var ph = Math.floor(nowSec * 6) % 2;
      ctx.fillStyle = ph ? "#3b6cff" : "#ff4455";
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
      ctx.fillRect(x + len / 2 - 9, y + 8, 8, 6); ctx.fillRect(x + len / 2 + 1, y + 8, 8, 6);
      ctx.shadowBlur = 0;
    }
  }
  var hX = dir > 0 ? x + len - 3 : x, tX = dir > 0 ? x : x + len - 3;
  ctx.fillStyle = "#fff2b8"; // 大灯
  if (nt > 0.05) { ctx.shadowColor = "#ffe08a"; ctx.shadowBlur = 12 * nt; }
  ctx.fillRect(hX, y + 4, 3, 5); ctx.fillRect(hX, y + 21, 3, 5);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ff5249"; // 尾灯
  if (nt > 0.05) { ctx.shadowColor = "#ff5249"; ctx.shadowBlur = 8 * nt; }
  ctx.fillRect(tX, y + 4, 3, 5); ctx.fillRect(tX, y + 21, 3, 5);
  ctx.shadowBlur = 0;
}

function drawPlayer() {
  var x = player.px + OX, y = player.py;
  if (player.inv > 0 && state === "PLAY" && Math.floor(nowSec * 9) % 2 === 0) ctx.globalAlpha = 0.35; // 无敌闪烁
  ctx.save(); ctx.translate(x, y); ctx.rotate(player.face);
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath(); ctx.ellipse(0, 3, 13, 9, 0, 0, Math.PI * 2); ctx.fill();
  var bob = player.moving ? Math.sin(nowSec * 30) * 3.5 : 0; // 走路摆臂
  ctx.fillStyle = "#ffd9b3";
  ctx.beginPath(); ctx.arc(-14, bob, 3.2, 0, Math.PI * 2); ctx.arc(14, -bob, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ff5a5f"; roundRect(ctx, -12, -10, 24, 19, 8); ctx.fill();
  ctx.fillStyle = "#4a3220"; ctx.beginPath(); ctx.arc(0, 1.5, 8, 0, Math.PI); ctx.closePath(); ctx.fill(); // 头发
  ctx.fillStyle = "#ffd9b3"; ctx.beginPath(); ctx.arc(0, 0.5, 8, 0, Math.PI * 2); ctx.fill(); // 头
  ctx.restore();
  ctx.globalAlpha = 1;
}

function render() {
  var nt = nightT, i;
  // 草地与路面（日夜插值）
  ctx.fillStyle = hexLerp("#46b45e", "#173a24", nt);
  ctx.fillRect(0, 0, W, 48); ctx.fillRect(0, 624, W, 96);
  ctx.fillStyle = hexLerp("#43464f", "#23252d", nt);
  ctx.fillRect(0, 48, W, 576);
  // 草丛
  ctx.fillStyle = hexLerp("#3a9e50", "#122e1c", nt);
  for (i = 0; i < tufts.length; i++) ctx.fillRect(tufts[i].x, tufts[i].y, tufts[i].w, 4);
  // 顶部终点格纹
  ctx.fillStyle = "rgba(255,255,255," + (0.22 - nt * 0.08) + ")";
  for (i = 0; i < 20; i += 2) { ctx.fillRect(i * 24, 0, 24, 12); ctx.fillRect(i * 24 + 24, 12, 24, 12); }
  // 护栏（上 / 下路缘）
  ctx.fillStyle = hexLerp("#c2c8d2", "#5a6270", nt);
  ctx.fillRect(0, 45, W, 3); ctx.fillRect(0, 622, W, 3);
  for (i = 0; i < W; i += 40) { ctx.fillRect(i, 48, 3, 5); ctx.fillRect(i, 616, 3, 5); }
  // 车道分隔虚线
  ctx.fillStyle = "rgba(255,255,255," + (0.3 - nt * 0.12) + ")";
  for (i = 1; i < N_LANES; i++) { var dy = 48 + i * CELL; for (var x = 6; x < W; x += 48) ctx.fillRect(x, dy - 1.5, 26, 3); }
  // 斑马线（中央竖向过街带）
  ctx.fillStyle = "rgba(255,255,255," + (0.34 - nt * 0.14) + ")";
  for (i = 1; i <= N_LANES; i++) { var ly = 48 + (i - 1) * CELL; ctx.fillRect(168, ly + 9, 96, 8); ctx.fillRect(168, ly + 31, 96, 8); }
  // 车辆
  for (i = 0; i < N_LANES; i++) {
    var lane = lanes[i], top = 48 + i * CELL;
    var rects = carRects(lane);
    for (var c = 0; c < rects.length; c++) drawCar(rects[c], lane, top, nt);
  }
  // 玩家
  if (state !== "MENU") drawPlayer();
  // 粒子
  for (i = 0; i < particles.length; i++) {
    var p2 = particles[i];
    ctx.globalAlpha = Math.max(0, p2.life / 0.55);
    ctx.fillStyle = p2.color;
    ctx.fillRect(p2.x - p2.size / 2, p2.y - p2.size / 2, p2.size, p2.size);
  }
  ctx.globalAlpha = 1;
  // 浮动分数
  ctx.font = "800 16px sans-serif"; ctx.textAlign = "center";
  for (i = 0; i < floats.length; i++) {
    var f2 = floats[i];
    ctx.globalAlpha = Math.min(1, f2.life / 0.4);
    ctx.fillStyle = f2.color;
    ctx.fillText(f2.text, f2.x, f2.y);
  }
  ctx.globalAlpha = 1;
  // 中央提示
  for (i = 0; i < toasts.length; i++) {
    var t2 = toasts[i];
    ctx.globalAlpha = Math.min(1, t2.life / 0.5);
    ctx.fillStyle = t2.color; ctx.font = "900 30px sans-serif";
    ctx.fillText(t2.text, W / 2, 320);
  }
  ctx.globalAlpha = 1;
}

// ===================== 主循环 =====================
var last = 0;
function frame(t) {
  var dt = Math.min((t - last) / 1000, 0.033); last = t; nowSec = t / 1000;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ===================== 输入：键盘 + 触控 =====================
function canvasPos(clientX, clientY) {
  var rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left) / rect.width * W, y: (clientY - rect.top) / rect.height * H };
}
function tapMove(p) { // 点击相邻格移动
  var c = Math.floor((p.x - OX) / CELL), r = Math.floor(p.y / CELL);
  var dc = c - player.col, dr = r - player.row;
  if (Math.abs(dc) + Math.abs(dr) === 1) { if (dc !== 0) tryMove(dc, 0); else tryMove(0, dr); }
}
document.addEventListener("keydown", function (e) {
  var k = e.key;
  if (k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown" || k === " ") e.preventDefault();
  if (state !== "PLAY") {
    if (k === "Enter" || k === " ") { ensureAudio(); startGame(); }
    return;
  }
  if (k === "ArrowLeft" || k === "a" || k === "A") tryMove(-1, 0);
  else if (k === "ArrowRight" || k === "d" || k === "D") tryMove(1, 0);
  else if (k === "ArrowUp" || k === "w" || k === "W") tryMove(0, -1);
  else if (k === "ArrowDown" || k === "s" || k === "S") tryMove(0, 1);
});
var touchStart = null;
canvas.addEventListener("touchstart", function (e) {
  e.preventDefault(); ensureAudio();
  touchStart = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
}, { passive: false });
canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
canvas.addEventListener("touchend", function (e) {
  e.preventDefault();
  if (!touchStart) return;
  var dx = e.changedTouches[0].clientX - touchStart.x, dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (state !== "PLAY") return;
  var adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) >= 24) { // 滑动手势
    if (adx > ady) tryMove(dx > 0 ? 1 : -1, 0); else tryMove(0, dy > 0 ? 1 : -1);
  } else {
    tapMove(canvasPos(e.changedTouches[0].clientX, e.changedTouches[0].clientY)); // 点击相邻格
  }
}, { passive: false });
canvas.addEventListener("mousedown", function (e) { ensureAudio(); if (state === "PLAY") tapMove(canvasPos(e.clientX, e.clientY)); });
canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
document.getElementById("playBtn").addEventListener("click", function (e) { e.stopPropagation(); ensureAudio(); startGame(); });

var sndBtn = document.getElementById("sndBtn");
function updSnd() { sndBtn.textContent = muted ? "SOUND OFF" : "SOUND ON"; }
sndBtn.addEventListener("click", function (e) {
  e.stopPropagation();
  muted = !muted;
  try { localStorage.setItem("td_muted", muted ? "1" : "0"); } catch (err) {}
  updSnd();
  if (!muted) { ensureAudio(); sMove(); }
});

// ===================== 启动 =====================
showOverlay("MENU");
updHUD();
fit();
// 调试/测试钩子（不影响游戏逻辑）
window.__td = {
  get state() { return state; }, get score() { return score; }, get round() { return round; },
  get lives() { return lives; }, get combo() { return combo; }, get night() { return nightT; },
  get player() { return player; }, get lanes() { return lanes; }
};
</script>
</body>
</html>
